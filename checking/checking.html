<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตรวจสอบประวัติการจอง - NT Service</title>
  <link rel="icon" type="image/png" href="../img/NT.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../index.css">
  <link rel="stylesheet" href="checking.css">
</head>

<body>

  <!-- ─── NAV ─── -->
  <nav>
    <div class="nav-inner" style="padding: 0;">
      <a href="../index.html" class="nav-logo" style="text-decoration: none;">
        <img src="../img/NT.png" alt="NT Service">
        <div class="nav-brand">
          <span class="nav-brand-main">NT Service</span>
        </div>
      </a>
      <a href="../index.html" class="nav-back" style="text-decoration: none;">&larr; กลับหน้าหลัก</a>
    </div>
  </nav>

  <!-- ─── CHECKING SECTION ─── -->
  <div class="checking-wrapper">
    <div class="checking-bg"></div>
    <div class="checking-card">
      <div class="checking-header">
        <p class="section-tag">Booking History</p>
        <h2 class="section-title">ตรวจสอบประวัติการจอง</h2>
        <p style="color: var(--muted); font-size: 0.95rem; font-weight: 300;">กรอกเบอร์โทรศัพท์มือถือที่ใช้ในการจองเพื่อตรวจสอบประวัติและสถานะคิว</p>
      </div>

      <div class="search-container">
        <div class="search-input-wrap">
          <input type="tel" id="search-phone" placeholder="กรอกเบอร์โทรศัพท์ เช่น 08XXXXXXXX" autocomplete="tel" maxlength="10">
        </div>
        <button type="button" id="btn-search" class="btn-search">🔍 ค้นหาคิว</button>
      </div>

      <div id="search-results"></div>
    </div>
  </div>

  <!-- ─── FOOTER ─── -->
  <footer>
    <div class="footer-brand">NT Service</div>
    <div class="footer-credit">© อู่ช่างตี๋ NT Service | design by Pakornkiat Vonma</div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyB2uzIukhYQ9lrCKPSWeBzLG3hz58PTixY",
      authDomain: "nt-service-booking.firebaseapp.com",
      projectId: "nt-service-booking",
      storageBucket: "nt-service-booking.firebasestorage.app",
      messagingSenderId: "912294226965",
      appId: "1:912294226965:web:3d4cb7baf50ef9f6b8b21c",
      measurementId: "G-Q0C82P2MRR"
    };

    let app, db;
    try {
      if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
        app = initializeApp(firebaseConfig);
        db = getFirestore(app);
      }
    } catch (e) {
      console.error("Firebase init error", e);
    }

    const btnSearch = document.getElementById('btn-search');
    const searchResults = document.getElementById('search-results');

    btnSearch.addEventListener('click', async () => {
      const phoneInput = document.getElementById('search-phone');
      const phone = phoneInput.value.trim();
      
      if (!phone) { 
        alert('กรุณากรอกเบอร์โทรศัพท์เพื่อค้นหาคิวรับบริการ'); 
        phoneInput.focus();
        return; 
      }
      
      if (!db) { 
        alert('ระบบฐานข้อมูลยังไม่พร้อมใช้งาน กรุณาลองใหม่อีกครั้งในภายหลัง'); 
        return; 
      }

      const originalText = btnSearch.textContent;
      btnSearch.textContent = 'กำลังค้นหา...';
      btnSearch.disabled = true;
      searchResults.innerHTML = '';

      try {
        const q = query(collection(db, "bookings"), where("phone", "==", phone));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          searchResults.innerHTML = `
            <div style="text-align:center; padding: 2rem; color: var(--rust-light); font-weight: 500;">
              ไม่พบประวัติการจองคิวสำหรับเบอร์โทรศัพท์นี้
            </div>`;
        } else {
          // Sort results locally to avoid composite index requirement
          const bookings = [];
          querySnapshot.forEach(docSnap => {
            bookings.push({ id: docSnap.id, ...docSnap.data() });
          });

          bookings.sort((a, b) => {
            const dateTimeA = (a.date || "") + "T" + (a.time || "00:00");
            const dateTimeB = (b.date || "") + "T" + (b.time || "00:00");
            return dateTimeB.localeCompare(dateTimeA); // Latest bookings first
          });

          let html = '';
          bookings.forEach((booking) => {
            const { id, date, time, name, car, service, status, details } = booking;

            // Date parsing (avoid timezone bugs by constructing local midnight date)
            const [year, month, day] = date.split('-').map(Number);
            const appointmentDate = new Date(year, month - 1, day);
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const diffTime = appointmentDate.getTime() - today.getTime();
            const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

            // Generate Timeline Stepper UI
            let stepperHtml = '';
            if (status === 'ยกเลิก') {
              stepperHtml = `
                <div class="status-stepper">
                  <div class="step-item">
                    <div class="step-dot">✓</div>
                    <div class="step-label">ส่งคำขอจองคิว</div>
                  </div>
                  <div class="step-item cancelled">
                    <div class="step-dot">❌</div>
                    <div class="step-label">ยกเลิกคิวแล้ว</div>
                  </div>
                </div>`;
            } else {
              stepperHtml = `
                <div class="status-stepper">
                  <div class="step-item confirmed">
                    <div class="step-dot">✓</div>
                    <div class="step-label">ส่งคำขอจองคิว</div>
                  </div>
                  <div class="step-item ${status === 'ยืนยันแล้ว' ? 'confirmed' : 'active'}">
                    <div class="step-dot">${status === 'ยืนยันแล้ว' ? '✓' : '⏳'}</div>
                    <div class="step-label">${status === 'ยืนยันแล้ว' ? 'ยืนยันคิวเรียบร้อย' : 'กำลังรอประสานงาน'}</div>
                  </div>
                </div>`;
            }

            // Cancellation Action logic
            let cancelActionHtml = '';
            if (status !== 'ยกเลิก') {
              if (diffDays > 1) {
                cancelActionHtml = `
                  <button type="button" class="btn-user-cancel" data-id="${id}">❌ ยกเลิกคิวจองนี้</button>
                  <p class="cancel-notice">คุณสามารถยกเลิกคิวออนไลน์ได้ด้วยตนเอง (ล่วงหน้าอย่างน้อย 1 วัน)</p>`;
              } else {
                cancelActionHtml = `
                  <p class="cancel-notice" style="color:var(--muted); font-size: 0.85rem;">
                    ⚠️ ใกล้วันเข้ารับบริการแล้ว หากต้องการเปลี่ยนแปลงหรือยกเลิกคิว กรุณาโทรติดต่ออู่ช่างตี๋โดยตรง
                  </p>`;
              }
            }

            html += `
              <div class="booking-result-item">
                <div class="booking-result-header">
                  <div class="booking-result-date">🗓️ วันนัดหมาย: ${date}</div>
                  <div class="booking-result-time">⏰ เวลา: ${time} น.</div>
                </div>

                <div class="booking-detail-row">
                  <div class="booking-detail-label">ชื่อผู้จอง:</div>
                  <div class="booking-detail-value">${name}</div>
                </div>
                <div class="booking-detail-row">
                  <div class="booking-detail-label">ยี่ห้อ/รุ่นรถ:</div>
                  <div class="booking-detail-value">${car}</div>
                </div>
                <div class="booking-detail-row">
                  <div class="booking-detail-label">ประเภทบริการ:</div>
                  <div class="booking-detail-value">${service}</div>
                </div>
                <div class="booking-detail-row">
                  <div class="booking-detail-label">อาการเพิ่มเติม:</div>
                  <div class="booking-detail-value">${details || 'ไม่ได้ระบุ'}</div>
                </div>

                ${stepperHtml}
                ${cancelActionHtml}
              </div>`;
          });

          searchResults.innerHTML = html;
        }
      } catch (err) {
        console.error(err);
        searchResults.innerHTML = `
          <div style="text-align:center; padding: 2rem; color: var(--rust-light); font-weight: 500;">
            เกิดข้อผิดพลาดในการดึงข้อมูล กรุณาลองใหม่อีกครั้ง
          </div>`;
      } finally {
        btnSearch.textContent = originalText;
        btnSearch.disabled = false;
      }
    });

    // Handle cancellation click
    searchResults.addEventListener('click', async (e) => {
      if (e.target.classList.contains('btn-user-cancel')) {
        const id = e.target.getAttribute('data-id');
        
        if (confirm('คุณแน่ใจหรือไม่ว่าต้องการยกเลิกคิวรับบริการนี้?')) {
          e.target.textContent = 'กำลังทำการยกเลิก...';
          e.target.disabled = true;
          
          try {
            await updateDoc(doc(db, "bookings", id), { status: 'ยกเลิก' });
            alert('ยกเลิกคิวรับบริการของคุณสำเร็จเรียบร้อยแล้ว');
            btnSearch.click(); // Refresh list
          } catch(err) {
            console.error("Cancel booking error:", err);
            alert('เกิดข้อผิดพลาดในการยกเลิกคิว กรุณาติดต่อทางอู่โดยตรง');
            btnSearch.click();
          }
        }
      }
    });
  </script>

</body>

</html>
