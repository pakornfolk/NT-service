<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตรวจสอบประวัติการจอง - NT Service</title>
  <link rel="icon" type="image/png" href="../img/NT.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="checking.css">
  <link rel="stylesheet" href="../index.css">
</head>
<body>

  <nav>
    <a href="../index.html" class="nav-logo">
      <img src="../img/NT.png" alt="NT Service">
      <div class="nav-brand">
        <span class="nav-brand-main">NT Service</span>
      </div>
    </a>
    <a href="../index.html" class="nav-back">&larr; กลับหน้าหลัก</a>
  </nav>

  <div class="checking-wrapper">
    <div class="checking-bg"></div>
    <div class="checking-card">
      <div class="checking-header">
        <p class="section-tag">Booking History</p>
        <h2 class="section-title">ตรวจสอบประวัติการจอง</h2>
        <p style="color: var(--muted); font-size: 0.9rem;">กรอกเบอร์โทรศัพท์เพื่อตรวจสอบสถานะ หรือยกเลิกคิว (ล่วงหน้า 1 วัน)</p>
      </div>

      <div class="form-group">
        <input type="tel" id="search-phone" placeholder="กรอกเบอร์โทรศัพท์ที่ใช้จอง" autocomplete="off">
      </div>
      <button type="button" id="btn-search" class="btn-submit">🔍 ค้นหา</button>
      
      <div id="search-results" style="margin-top: 2rem;"></div>
    </div>
  </div>
  <!-- ─── FOOTER ─── -->
  <footer>
    <div class="footer-brand">NT Service</div>
    <div class="footer-credit">© อู่ช่างตี๋ NT Service | design by Pakornkiat Vonma</div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB2uzIukhYQ9lrCKPSWeBzLG3hz58PTixY",
      authDomain: "nt-service-booking.firebaseapp.com",
      projectId: "nt-service-booking",
      storageBucket: "nt-service-booking.firebasestorage.app",
      messagingSenderId: "912294226965",
      appId: "1:912294226965:web:3d4cb7baf50ef9f6b8b21c",
      measurementId: "G-Q0C82P2MRR"
    };

    let app, db;
    try {
      if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
        app = initializeApp(firebaseConfig);
        db = getFirestore(app);
      }
    } catch (e) {
      console.error("Firebase init error", e);
    }

    const btnSearch = document.getElementById('btn-search');
    const searchResults = document.getElementById('search-results');

    btnSearch.addEventListener('click', async () => {
      const phone = document.getElementById('search-phone').value.trim();
      if(!phone) { alert('กรุณากรอกเบอร์โทรศัพท์เพื่อค้นหาคิว'); return; }
      if (!db) { alert('ระบบฐานข้อมูลยังไม่พร้อม'); return; }
      
      btnSearch.textContent = 'กำลังค้นหา...';
      try {
        const q = query(collection(db, "bookings"), where("phone", "==", phone));
        const querySnapshot = await getDocs(q);
        
        if (querySnapshot.empty) {
          searchResults.innerHTML = '<p style="color:var(--rust); text-align:center;">ไม่พบประวัติการจองคิวของเบอร์โทรศัพท์นี้</p>';
        } else {
          let html = '<div style="background:var(--black); padding:1.5rem; border-radius:4px; border:1px solid var(--border);">';
          querySnapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const id = docSnap.id;
            
            const appointmentDate = new Date(data.date);
            const today = new Date();
            today.setHours(0,0,0,0);
            
            const diffTime = appointmentDate.getTime() - today.getTime();
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
            
            let cancelBtn = '';
            if (data.status !== 'ยกเลิก' && diffDays > 1) {
               cancelBtn = `<button type="button" class="btn-user-cancel" data-id="${id}" style="margin-top:1rem; width:100%; background:rgba(231,76,60,0.1); color:#e74c3c; border:1px solid #e74c3c; padding:0.6rem; border-radius:2px; cursor:pointer; font-family:'Prompt';">❌ ยกเลิกคิวนี้</button>`;
            } else if (data.status !== 'ยกเลิก' && diffDays <= 1) {
               cancelBtn = `<p style="font-size:0.8rem; color:var(--muted); margin-top:0.8rem; text-align:center;">(ใกล้วันนัดหมายแล้ว หากต้องการยกเลิกกรุณาติดต่ออู่โดยตรง)</p>`;
            }

            html += `
              <div style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; font-size: 0.95rem;">
                <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;">
                  <span><strong>วันที่:</strong> <span style="color:var(--white);">${data.date}</span></span>
                  <span><strong>เวลา:</strong> <span style="color:var(--white);">${data.time}</span></span>
                </div>
                <div style="margin-bottom:0.5rem;"><strong>บริการ:</strong> ${data.service}</div>
                <div style="margin-bottom:0.5rem;"><strong>รถยนต์:</strong> ${data.car}</div>
                <div><strong>สถานะคิว:</strong> <span style="font-weight:600; padding: 0.2rem 0.5rem; border-radius:2px; color:${data.status==='ยกเลิก'?'#e74c3c':(data.status==='ยืนยันแล้ว'?'#2ecc71':'var(--amber)')}; background:rgba(255,255,255,0.05);">${data.status}</span></div>
                ${cancelBtn}
              </div>
            `;
          });
          html += '</div>';
          searchResults.innerHTML = html;
        }
      } catch (err) {
        console.error(err);
        searchResults.innerHTML = '<p style="color:var(--rust); text-align:center;">เกิดข้อผิดพลาดในการค้นหาข้อมูล</p>';
      }
      btnSearch.textContent = '🔍 ค้นหา';
    });

    searchResults.addEventListener('click', async (e) => {
      if (e.target.classList.contains('btn-user-cancel')) {
        if(confirm('คุณแน่ใจหรือไม่ว่าต้องการยกเลิกคิวนี้?')) {
          const id = e.target.getAttribute('data-id');
          e.target.textContent = 'กำลังยกเลิก...';
          e.target.disabled = true;
          try {
            await updateDoc(doc(db, "bookings", id), { status: 'ยกเลิก' });
            alert('ยกเลิกคิวของคุณเรียบร้อยแล้ว');
            btnSearch.click(); 
          } catch(err) {
            alert('เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
            btnSearch.click();
          }
        }
      }
    });
  </script>
  
</body>
</html>
